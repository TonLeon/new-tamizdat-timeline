<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Новый тамиздат: хронология / The New Tamizdat: a timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
<style>
/* Fonts are served by tamizdatproject.org itself, so the embed renders exactly like the site.
   The URLs carry the site's build hash: if they change, ask Alexander for the new ones.
   The site's Excelsior .woff2 is corrupt (browsers skip it), so the .woff/.ttf are used.
   Local files (gitignored) and Google's Inter are fallbacks for working offline. */
@font-face{
  font-family:"Excelsior LT Std";
  src:url("https://tamizdatproject.org/static/images/excelsior-lt-std.13c9f32f8942.woff") format("woff"),url("https://tamizdatproject.org/static/images/excelsior-lt-std.13009e353ffe.ttf") format("truetype"),url("excelsior-lt-std-3.woff2") format("woff2"),url("excelsior-lt-std-3.ttf") format("truetype");
  font-weight:400;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"Inter Variable";
  src:url("https://tamizdatproject.org/static/images/InterVariable.2bf3d951bf9d.woff2") format("woff2");
  font-weight:100 900;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:"Inter Variable";
  src:url("https://tamizdatproject.org/static/images/InterVariable-Italic.8d1dc86da258.woff2") format("woff2");
  font-weight:100 900;
  font-style:italic;
  font-display:swap;
}
:root{
  /* ---- Tier 1 — primitives (tamizdat-design-system.md §2; used directly only via Tier 2 and in the doc's shadow recipes) ---- */
  --ink-950:#1f2a2e; --ink-900:#263338; --ink-700:#576266; --ink-500:#8a9599; --ink-300:#c2c9cc;
  --paper:#fcfaf7; --warm-100:#f5f3f0; --warm-150:#f0eeeb; --warm-200:#edebe8;
  --indigo:#6155f5;
  --alpha-black-10:rgba(0,0,0,.1); --alpha-black-12:rgba(0,0,0,.12); --alpha-black-20:rgba(0,0,0,.2);
  --alpha-black-40:rgba(0,0,0,.4);

  /* ---- Tier 2 — semantic tokens ---- */
  --color-text-primary:var(--ink-900);
  --color-text-secondary:var(--ink-700);
  --color-text-tertiary:var(--ink-500);
  --color-text-weak:var(--ink-300);
  --color-text-inverse:var(--paper);
  --color-surface-primary:var(--paper);
  --color-surface-secondary:var(--warm-100);
  --color-surface-secondary-hover:var(--warm-200);
  --color-surface-secondary-active:var(--warm-150);
  --color-surface-tertiary:var(--warm-200);
  --color-surface-inverse:var(--ink-950);
  --color-border:var(--alpha-black-10);
  --color-border-secondary:var(--alpha-black-12);
  --color-accent:var(--indigo);
  --color-overlay:var(--alpha-black-40);

  /* ---- Local additions (§10: not in the shared system — report back to Tamizdat) ---- */
  --color-game-ink:#3e69b7;                  /* the game's one accent, used instead of the site's indigo */
  --color-signal-correct:var(--color-game-ink); /* "correct" stamp */
  --color-signal-adjust:#b3322b;              /* «Отклонено» stamp and moved-card marks — local, reddish */
  --game-width:1180px;                        /* two-column board needs more than --review-content-width (970px) */

  --radius-s:4px; --radius-m:6px; --radius-l:8px; --radius-round:999px;

  --font-sans:"Inter Variable","Inter",sans-serif;
  --font-serif:"Excelsior LT Std","Excelsior",serif;
  --container-pad:2rem;

  /* ---- Typography tokens used below (§3; full catalogue in tamizdat-design-system.md) ---- */
  --type-sans-d-l-reg-loose-fs:18px;   --type-sans-d-l-reg-loose-lh:26px;   --type-sans-d-l-reg-loose-ls:0px;
  --type-sans-d-m-reg-loose-fs:16px;   --type-sans-d-m-reg-loose-lh:24px;   --type-sans-d-m-reg-loose-ls:.1px;
  --type-sans-d-s-reg-loose-fs:14px;   --type-sans-d-s-reg-loose-lh:20px;   --type-sans-d-s-reg-loose-ls:.11px;
  --type-sans-d-s-reg-tight-fs:14px;   --type-sans-d-s-reg-tight-lh:18px;   --type-sans-d-s-reg-tight-ls:.11px;
  --type-sans-d-s-bold-tight-fs:14px;  --type-sans-d-s-bold-tight-lh:18px;  --type-sans-d-s-bold-tight-ls:.112px;
  --type-sans-d-xs-reg-normal-fs:12px; --type-sans-d-xs-reg-normal-lh:16px; --type-sans-d-xs-reg-normal-ls:.11px;
  --type-sans-d-xs-bold-normal-fs:12px; --type-sans-d-xs-bold-normal-lh:16px; --type-sans-d-xs-bold-normal-ls:0px;
  --type-sans-m-m-reg-loose-fs:15px;   --type-sans-m-m-reg-loose-lh:22px;   --type-sans-m-m-reg-loose-ls:.15px;
  --type-sans-m-m-reg-tight-fs:15px;   --type-sans-m-m-reg-tight-lh:18px;   --type-sans-m-m-reg-tight-ls:.15px;
  --type-sans-m-s-reg-normal-fs:12px;  --type-sans-m-s-reg-normal-lh:18px;  --type-sans-m-s-reg-normal-ls:.12px;
  --type-sans-d-3xl-bold-normal-fs:64px; --type-sans-d-3xl-bold-normal-lh:64px; --type-sans-d-3xl-bold-normal-ls:-.96px;
  --type-sans-d-xl-bold-normal-fs:28px; --type-sans-d-xl-bold-normal-lh:36px; --type-sans-d-xl-bold-normal-ls:-.28px;
  --type-sans-m-xl-bold-normal-fs:24px; --type-sans-m-xl-bold-normal-lh:26px; --type-sans-m-xl-bold-normal-ls:.048px;
  --type-serif-d-3xl-fs:64px; --type-serif-d-3xl-lh:64px; --type-serif-d-3xl-ls:-.64px;
  --type-serif-d-2xl-fs:45px; --type-serif-d-2xl-lh:48px; --type-serif-d-2xl-ls:-.9px;
  --type-serif-d-xl-fs:32px;  --type-serif-d-xl-lh:36px;  --type-serif-d-xl-ls:-.32px;
  --type-serif-d-l-fs:21px;   --type-serif-d-l-lh:32px;   --type-serif-d-l-ls:-.21px;
  --type-serif-t-2xl-fs:32px; --type-serif-t-2xl-lh:34px; --type-serif-t-2xl-ls:-.64px;
  --type-serif-t-xl-fs:24px;  --type-serif-t-xl-lh:28px;  --type-serif-t-xl-ls:-.24px;
  --type-serif-m-l-fs:16px; --type-serif-m-l-lh:24px; --type-serif-m-l-ls:-.16px;
  --type-serif-m-2xl-fs:20px; --type-serif-m-2xl-lh:22px; --type-serif-m-2xl-ls:-.2px;

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media screen and (max-width:768px){ :root{ --container-pad:1rem; } }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;
  background:var(--color-surface-primary);
  color:var(--color-text-primary);
  font-family:var(--font-sans);
  font-size:var(--type-sans-d-m-reg-loose-fs);
  line-height:var(--type-sans-d-m-reg-loose-lh);
  letter-spacing:var(--type-sans-d-m-reg-loose-ls);
  font-variation-settings:"opsz" 32;
  font-optical-sizing:auto;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
img{max-width:100%}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-decoration-color:var(--color-text-weak);text-decoration-thickness:1px;text-underline-offset:4px}
button{font:inherit;color:inherit;letter-spacing:inherit}
/* focus-visible isn't defined by the system (§10) — local, uses the one accent */
:focus-visible{outline:2px solid var(--color-game-ink);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* Language switch: the host page provides the title bar, so the game carries only this quiet toggle */
.topbar{display:flex;justify-content:flex-end;margin:-.75rem -.5rem .25rem 0}
/* «The New Tamizdat» leads back to the start: the game heading itself, or a small line above other headings */
.home-link{display:inline;padding:0;border:0;background:none;font:inherit;letter-spacing:inherit;color:inherit;text-align:left;cursor:pointer}
.home-link:hover{text-decoration:underline;text-decoration-color:var(--color-text-weak);text-decoration-thickness:1px;text-underline-offset:4px}
.home-crumb{margin:0 0 1rem;color:var(--color-text-tertiary);font-weight:600;font-size:var(--type-sans-d-s-bold-tight-fs);line-height:var(--type-sans-d-s-bold-tight-lh);letter-spacing:var(--type-sans-d-s-bold-tight-ls)}
.home-crumb .home-link:hover{color:var(--color-text-primary)}
/* Leave-the-round confirmation, inline (a browser confirm() can be blocked inside the site's frame) */
.exit-confirm{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1.5rem;margin:0 0 1.5rem;padding:1rem 1.5rem;border-radius:var(--radius-l);background:var(--color-surface-secondary)}
.exit-confirm p{flex:1 1 16rem;margin:0}
.exit-confirm .btns{display:flex;gap:.75rem}
.lang{display:flex;gap:.25rem}
.lang button{background:none;border:0;min-width:40px;min-height:40px;padding:0 .5rem;font-weight:600;font-size:var(--type-sans-d-xs-bold-normal-fs);line-height:var(--type-sans-d-xs-bold-normal-lh);letter-spacing:var(--type-sans-d-xs-bold-normal-ls);color:var(--color-text-tertiary);cursor:pointer;border-bottom:2px solid transparent}
.lang button[aria-pressed="true"]{color:var(--color-text-primary);border-bottom-color:var(--color-game-ink)}

main{max-width:var(--game-width);margin:0 auto;padding:40px var(--container-pad) 80px}


/* Buttons — always pills, 1.5rem side padding (§8) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:44px;padding:0 1.5rem;border:1px solid var(--color-border);border-radius:var(--radius-round);background:transparent;color:var(--color-text-primary);font-family:var(--font-sans);font-weight:600;font-size:var(--type-sans-d-s-bold-tight-fs);line-height:var(--type-sans-d-s-bold-tight-lh);letter-spacing:var(--type-sans-d-s-bold-tight-ls);text-decoration:none;cursor:pointer;transition:background .2s ease,border-color .2s ease,color .2s ease}
.btn:hover{text-decoration:none;background:var(--color-surface-secondary-hover);border-color:var(--color-border-secondary)}
.btn:active{background:var(--color-surface-secondary-active)}
.btn.primary{background:var(--color-surface-inverse);border-color:var(--color-surface-inverse);color:var(--color-text-inverse)}
.btn.primary:hover{background:color-mix(in srgb,var(--color-surface-inverse) 88%,var(--color-game-ink))}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.btn.quiet{border-color:transparent;background:transparent;text-decoration:underline;text-decoration-color:var(--color-text-weak);text-underline-offset:4px;padding-inline:.5rem}
.btn.quiet:hover{text-decoration:underline;text-decoration-color:var(--color-text-primary)}
.actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:2rem}

/* Landing */
.landing{max-width:42rem}
/* Inter semibold at the system's largest step (sans 3xl, 64px), like the site's page titles; same size at every width — there is no tablet/mobile 3xl token */
.hero-title{font-family:var(--font-sans);font-weight:600;font-size:var(--type-sans-d-3xl-bold-normal-fs);line-height:var(--type-sans-d-3xl-bold-normal-lh);letter-spacing:var(--type-sans-d-3xl-bold-normal-ls);margin:0 0 1rem}
.redact{position:relative;display:inline-block}
.redact::after{content:"";position:absolute;left:-.04em;right:-.04em;top:.12em;bottom:.02em;border-radius:var(--radius-s);background:var(--color-surface-inverse);transform-origin:right center;animation:lift .4s cubic-bezier(.03,.96,.52,.98) forwards;animation-delay:calc(.5s + var(--i) * .25s)}
.no-anim .redact::after{display:none}
@keyframes lift{to{transform:scaleX(0)}}
.hero-kicker{font-family:var(--font-serif);font-weight:400;font-size:var(--type-serif-d-l-fs);line-height:var(--type-serif-d-l-lh);letter-spacing:var(--type-serif-d-l-ls);color:var(--color-text-secondary);margin:0 0 1.5rem}
.intro{font-size:var(--type-sans-d-m-reg-loose-fs);line-height:var(--type-sans-d-m-reg-loose-lh);letter-spacing:var(--type-sans-d-m-reg-loose-ls);max-width:34em;margin:0}
.hero-cards{display:flex;margin:80px 0 0;padding-left:.5rem}
.mini{width:118px;height:76px;flex:none;margin-left:-1rem;background:var(--color-surface-secondary);border-radius:var(--radius-l);position:relative;transform:rotate(var(--r));box-shadow:0 5px 10px -5px var(--alpha-black-20);outline:4px solid var(--color-surface-primary)}
.mini:first-child{margin-left:0}
.mini::before{content:"";position:absolute;left:.75rem;right:.75rem;top:1rem;border-top:1px solid var(--color-border)}
.mini::after{content:"";position:absolute;left:.75rem;top:2rem;width:58%;height:.5rem;border-radius:var(--radius-s);background:var(--color-surface-inverse);box-shadow:0 1rem 0 -1px var(--color-border-secondary)}
@media screen and (max-width:768px){.mini:nth-child(n+6){display:none}}
@media screen and (max-width:576px){.mini:nth-child(n+4){display:none}}

/* Section headings: serif 2xl, tablet step t-2xl (no mobile step below it — m-2xl would equal the card titles) */
.rules h1,.rounds h1,.end-head h1{font-family:var(--font-serif);font-weight:400;font-size:var(--type-serif-d-2xl-fs);line-height:var(--type-serif-d-2xl-lh);letter-spacing:var(--type-serif-d-2xl-ls);margin:0 0 1.5rem}

/* Rules */
.rules-body{display:grid;grid-template-columns:minmax(0,38rem) minmax(0,1fr);gap:40px;align-items:start}
.rules-text{max-width:38rem}
@media screen and (max-width:991px){.rules-body{grid-template-columns:1fr}.rules-demo{order:-1}}

/* How-to demo: a miniature board drawn in container units (cqw), so it scales with its column.
   A small step sequencer (JS) sets data-step; positions move by CSS transitions. */
.rules-demo{position:sticky;top:calc(1.5rem + env(safe-area-inset-top,0px))}
.demo{container-type:inline-size;background:var(--color-surface-secondary);border-radius:var(--radius-l);padding:1.5rem}
.demo-stage{position:relative;aspect-ratio:100/74;transition:opacity .3s ease}
.demo-stage.fade{opacity:0}
.demo-stage>*{position:absolute;transition:left .8s cubic-bezier(.45,0,.25,1),top .8s cubic-bezier(.45,0,.25,1),opacity .25s ease,transform .2s ease,box-shadow .2s ease,border-color .2s ease,background .2s ease,color .2s ease}
.demo-stage .d-spine{left:50%;top:0;bottom:0;width:1px;background:var(--color-text-weak)}
.d-card{width:38%;height:18%;padding:1.6cqw 2cqw;border-radius:1.2cqw;background:var(--color-surface-primary);box-shadow:0 .6cqw 1.2cqw -.6cqw var(--alpha-black-20);overflow:hidden}
.d-card.lifted{transform:rotate(-1.5deg);box-shadow:0 1.6cqw 3cqw -.8cqw var(--alpha-black-40)}
.d-card .d-meta{display:block;padding-bottom:.9cqw;border-bottom:1px solid var(--color-border);color:var(--color-text-tertiary);font-size:2.2cqw;line-height:1.3}
.d-card .d-title{display:block;margin-top:1.2cqw;font-family:var(--font-serif);font-size:2.9cqw;line-height:1.15;color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-card .d-line{display:block;height:1cqw;margin-top:1.3cqw;width:80%;border-radius:1cqw;background:var(--color-border-secondary)}
.d-card .d-stamp{position:absolute;right:1.6cqw;top:1.2cqw;transform:rotate(-6deg) scale(1.2);opacity:0;border:.25cqw solid var(--color-signal-correct);border-radius:.5cqw;padding:.1cqw .6cqw;color:var(--color-signal-correct);font-weight:600;font-size:1.5cqw;line-height:1.3;letter-spacing:.08em;text-transform:uppercase;background:var(--color-surface-primary);transition:opacity .2s ease,transform .2s ease}
.d-card .d-stamp.denied{border-color:var(--color-signal-adjust);color:var(--color-signal-adjust)}
.d-card.stamped .d-stamp{opacity:1;transform:rotate(-6deg) scale(1)}
.d-year{width:8%;text-align:right;font-family:var(--font-serif);font-size:2.9cqw;line-height:1;color:var(--color-text-primary)}
.d-dot{width:1.6cqw;height:1.6cqw;margin:-.8cqw 0 0 -.8cqw;border-radius:50%;background:var(--color-text-primary)}
.d-dot.denied{background:var(--color-surface-secondary);border:.35cqw solid var(--color-signal-adjust)}
.d-gap{left:54%;width:40%;height:5.5%;display:flex;align-items:center;gap:1.2cqw;padding:0 1.2cqw;border:1px dashed transparent;border-radius:.9cqw;color:var(--color-text-tertiary);font-size:2.3cqw;white-space:nowrap}
.d-gap::after{content:"";flex:1;border-top:1px dashed var(--color-border-secondary)}
.d-gap.on{border-color:var(--color-game-ink);color:var(--color-game-ink);background:color-mix(in srgb,var(--color-game-ink) 6%,transparent)}
.d-gap.on::after,.d-gap.miss::after{border-color:transparent}
.d-gap.miss{border-color:var(--color-signal-adjust);color:var(--color-signal-adjust)}
.d-btn{left:1%;top:31%;height:7%;padding:0 3cqw;display:flex;align-items:center;border-radius:10cqw;background:var(--color-surface-inverse);color:var(--color-text-inverse);font-weight:600;font-size:2.4cqw;opacity:.35}
.d-btn.ready{opacity:1}
.d-btn.press{transform:scale(.94)}
.d-hand{width:8cqw;height:8cqw;margin:-1.1cqw 0 0 -3.4cqw;opacity:0;pointer-events:none;z-index:3}
.d-hand svg{width:100%;height:100%;fill:var(--color-surface-primary);stroke:var(--color-text-primary);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s ease}
.d-hand.show{opacity:1}
.d-hand.press svg{transform:scale(.88) translateY(4%)}
.demo-foot{display:flex;align-items:flex-start;gap:1rem;margin-top:1rem}
.demo-caption{flex:1;margin:0;min-height:2lh;color:var(--color-text-secondary);font-size:var(--type-sans-d-s-reg-loose-fs);line-height:var(--type-sans-d-s-reg-loose-lh);letter-spacing:var(--type-sans-d-s-reg-loose-ls)}
.demo-toggle{flex:none;background:none;border:0;padding:0;color:var(--color-text-tertiary);cursor:pointer;text-decoration:underline;text-decoration-color:var(--color-text-weak);text-underline-offset:4px;font-size:var(--type-sans-d-s-reg-tight-fs);line-height:var(--type-sans-d-s-reg-loose-lh)}
.demo-toggle:hover{color:var(--color-text-primary)}
.demo-caption ol{margin:0;padding-left:1.1rem}
@media (prefers-reduced-motion:reduce){.demo-toggle{display:none}}
.rule-list{list-style:none;margin:0;padding:0;counter-reset:r}
.rule-list li{counter-increment:r;display:grid;grid-template-columns:2.5rem 1fr;gap:.75rem;padding:1rem 0;border-top:1px solid var(--color-border)}
.rule-list li::before{content:counter(r);font-family:var(--font-serif);font-size:var(--type-serif-d-l-fs);line-height:var(--type-sans-d-m-reg-loose-lh);letter-spacing:var(--type-serif-d-l-ls);color:var(--color-text-tertiary)}
/* Hidden (but read by screen readers) until the player presses Tab */
html:not(.kbd-user) .kbd-note{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.kbd-note{color:var(--color-text-tertiary);font-size:var(--type-sans-d-s-reg-loose-fs);line-height:var(--type-sans-d-s-reg-loose-lh);letter-spacing:var(--type-sans-d-s-reg-loose-ls);border-top:1px solid var(--color-border);padding-top:1rem;margin:0}

/* Game */
.game-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.5rem 1.5rem;margin-bottom:2rem;border-bottom:1px solid var(--color-border);padding-bottom:.75rem}
/* Inter semibold, matching the start-screen title (sans xl; the sans scale has no tablet step) */
.round-name{font-family:var(--font-sans);font-weight:600;font-size:var(--type-sans-d-xl-bold-normal-fs);line-height:var(--type-sans-d-xl-bold-normal-lh);letter-spacing:var(--type-sans-d-xl-bold-normal-ls);margin:0}
.progress{margin:0;color:var(--color-text-tertiary);font-size:var(--type-sans-d-s-reg-tight-fs);line-height:var(--type-sans-d-s-reg-tight-lh);letter-spacing:var(--type-sans-d-s-reg-tight-ls)}
.board{display:grid;grid-template-columns:minmax(290px,370px) 1fr;gap:40px;align-items:start}
.deck{position:sticky;top:calc(1.5rem + env(safe-area-inset-top,0px))}
.deck-stack{position:relative;margin:0 0 1.5rem}
.stack-edge{position:absolute;inset:0;background:var(--color-surface-secondary);border-radius:var(--radius-l);box-shadow:0 5px 10px -5px var(--alpha-black-20)}
.stack-edge.e1{transform:translate(6px,6px) rotate(.6deg)}
.stack-edge.e2{transform:translate(12px,12px) rotate(1.2deg)}
.deck-count{margin:0;color:var(--color-text-tertiary);font-size:var(--type-sans-d-xs-reg-normal-fs);line-height:var(--type-sans-d-xs-reg-normal-lh);letter-spacing:var(--type-sans-d-xs-reg-normal-ls)}
.deck-hint{margin:1.5rem 0 .25rem;color:var(--color-text-secondary);font-size:var(--type-sans-d-s-reg-loose-fs);line-height:var(--type-sans-d-s-reg-loose-lh);letter-spacing:var(--type-sans-d-s-reg-loose-ls)}
.deck-actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1rem}
.deck-actions .selected-info{display:none}
.deck-done{border-top:1px solid var(--color-border);padding-top:1rem}
.deck-done p{margin:0 0 1rem}

/* Event card (§8 "Карточки": surface-secondary, radius-l, 1.5rem padding for large cards) */
.card{position:relative;background:var(--color-surface-secondary);border-radius:var(--radius-l);padding:0 1.5rem 1.5rem}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;min-height:2.5rem;border-bottom:1px solid var(--color-border);color:var(--color-text-tertiary)}
.card-head svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
/* §8 metadata row with dot separators */
.meta{display:flex;align-items:center;flex-wrap:wrap;font-size:var(--type-sans-d-s-reg-tight-fs);line-height:var(--type-sans-d-s-reg-tight-lh);letter-spacing:var(--type-sans-d-s-reg-tight-ls);color:var(--color-text-tertiary)}
.meta .item::after{content:"";display:inline-block;width:2px;height:2px;background:var(--color-text-weak);border-radius:var(--radius-round);margin:auto .5rem;vertical-align:middle}
.meta .item:last-child::after{content:none}
.card-title{font-family:var(--font-serif);font-weight:400;font-size:var(--type-serif-d-xl-fs);line-height:var(--type-serif-d-xl-lh);letter-spacing:var(--type-serif-d-xl-ls);margin:1rem 0 .5rem}
.card-desc{margin:0;font-size:var(--type-sans-d-m-reg-loose-fs);line-height:var(--type-sans-d-m-reg-loose-lh);letter-spacing:var(--type-sans-d-m-reg-loose-ls)}
.card-date{margin:1rem 0 0;display:flex;gap:.5rem;align-items:center;color:var(--color-text-tertiary);font-size:var(--type-sans-d-s-reg-tight-fs);line-height:var(--type-sans-d-s-reg-tight-lh);letter-spacing:var(--type-sans-d-s-reg-tight-ls)}
.card-date .bar{display:inline-block;width:9.5em;height:1em;border-radius:var(--radius-s);background:var(--color-surface-inverse)}
/* §8 shadows: the card in hand is a "physical" card; a lifted one gets the hover recipe */
.card.current{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 88px 17.5px rgba(0,0,0,.01),0 50px 15px rgba(0,0,0,.03),0 22px 11px rgba(0,0,0,.05),0 6px 6px rgba(0,0,0,.06)}
.card.current:active{cursor:grabbing}
.card.current.lifted{opacity:.3}
.drag-clone{position:fixed;z-index:60;pointer-events:none;margin:0;transform:rotate(-1.5deg);box-shadow:0 5px 15px 0 var(--color-overlay)}

/* «Одобрено» / «Отклонено» stamps — game elements, not system components */
.stamp{position:absolute;right:1.5rem;top:calc(2.5rem + 1rem);transform:rotate(-6deg);border:2px solid var(--color-signal-correct);border-radius:var(--radius-s);background:transparent;color:var(--color-signal-correct);padding:.25rem .5rem;font-weight:600;font-size:var(--type-sans-d-xs-bold-normal-fs);line-height:var(--type-sans-d-xs-bold-normal-lh);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.just-placed .stamp{animation:press .2s ease}
@keyframes press{from{transform:rotate(-6deg) scale(1.2);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
.stamp.denied{border-color:var(--color-signal-adjust);color:var(--color-signal-adjust)}
@keyframes reveal{from{opacity:0}to{opacity:1}}
.fine{color:var(--color-text-tertiary);font-size:var(--type-sans-d-s-reg-loose-fs);line-height:var(--type-sans-d-s-reg-loose-lh);letter-spacing:var(--type-sans-d-s-reg-loose-ls)}

.src{margin:1rem 0 0;color:var(--color-text-tertiary);font-size:var(--type-sans-d-xs-reg-normal-fs);line-height:var(--type-sans-d-xs-reg-normal-lh);letter-spacing:var(--type-sans-d-xs-reg-normal-ls)}
.src a{text-decoration:underline;text-decoration-color:var(--color-text-weak);text-decoration-thickness:1px;text-underline-offset:4px}
.src a:hover{text-decoration-color:var(--color-text-primary)}

/* Timeline */
.tl{list-style:none;margin:0;padding:0}
.entry,.slot{display:grid;grid-template-columns:7.5rem 1.5rem minmax(0,1fr);column-gap:1rem}
.spine{position:relative;align-self:stretch}
.spine::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;margin-left:-.5px;background:var(--color-border-secondary)}
.entry .spine::after{content:"";position:absolute;left:50%;top:calc(1.5rem + 11px);width:10px;height:10px;margin-left:-5px;border-radius:var(--radius-round);background:var(--color-text-primary);box-shadow:0 0 0 4px var(--color-surface-primary)}
.entry.status-corrected .spine::after{background:var(--color-surface-primary);border:2px solid var(--color-signal-adjust)}
.slot.is-first .spine::before{top:50%;background:none;border-left:1px dashed var(--color-border-secondary);width:0}
.slot.is-last .spine::before{bottom:50%;background:none;border-left:1px dashed var(--color-border-secondary);width:0}
.slot.is-first.is-last .spine::before{display:none}
.entry-date{text-align:right;padding-top:1.5rem}
.entry-date .year{display:block;font-family:var(--font-serif);font-size:var(--type-serif-d-l-fs);line-height:var(--type-serif-d-l-lh);letter-spacing:var(--type-serif-d-l-ls)}
.entry-date .date-text{position:relative;display:inline-block;color:var(--color-text-tertiary);font-size:var(--type-sans-d-xs-reg-normal-fs);line-height:var(--type-sans-d-xs-reg-normal-lh);letter-spacing:var(--type-sans-d-xs-reg-normal-ls)}
.just-placed .date-text::after{content:"";position:absolute;inset:-1px -3px;border-radius:var(--radius-s);background:var(--color-surface-inverse);transform-origin:right;animation:lift .4s .15s cubic-bezier(.03,.96,.52,.98) forwards}
.entry .card{margin:.5rem 0}
/* Placed cards: serif l title over sans s text keeps the title clearly the louder of the two */
.entry .card-title{font-size:var(--type-serif-d-l-fs);line-height:var(--type-serif-d-l-lh);letter-spacing:var(--type-serif-d-l-ls);margin:.75rem 0 .25rem}
.entry .card-desc{font-size:var(--type-sans-d-s-reg-loose-fs);line-height:var(--type-sans-d-s-reg-loose-lh);letter-spacing:var(--type-sans-d-s-reg-loose-ls)}
.entry.status-correct .card-title,.entry.status-corrected .card-title{padding-right:8rem}

.slot-btn{grid-column:3;display:flex;align-items:center;gap:.75rem;width:100%;min-height:44px;margin:.25rem 0;padding:.5rem .75rem;border:1px dashed transparent;border-radius:var(--radius-m);background:none;color:var(--color-text-tertiary);text-align:left;cursor:pointer;font-size:var(--type-sans-d-s-reg-tight-fs);line-height:var(--type-sans-d-s-reg-tight-lh);letter-spacing:var(--type-sans-d-s-reg-tight-ls);transition:background .2s ease,border-color .2s ease,color .2s ease}
.slot-rule{flex:1;border-top:1px dashed var(--color-border-secondary);order:2}
.slot-label{order:1;white-space:nowrap}
.slot-btn:not(:disabled):hover,.slot-btn.drop-target{border-color:var(--color-game-ink);color:var(--color-game-ink);background:color-mix(in srgb,var(--color-game-ink) 6%,transparent)}
.slot-btn:not(:disabled):hover .slot-rule,.slot-btn.drop-target .slot-rule{border-color:var(--color-game-ink)}
.slot-btn:disabled{cursor:default}
.slot.selected .slot-btn{display:block;margin:.5rem 0;padding:.75rem 1rem;border:1px dashed var(--color-game-ink);background:var(--color-surface-secondary);color:var(--color-text-primary)}
.ghost-title{display:block;font-family:var(--font-serif);font-size:var(--type-serif-d-l-fs);line-height:var(--type-serif-d-l-lh);letter-spacing:var(--type-serif-d-l-ls)}
.ghost-hint{display:block;margin-top:.25rem;color:var(--color-game-ink);font-size:var(--type-sans-d-xs-reg-normal-fs);line-height:var(--type-sans-d-xs-reg-normal-lh);letter-spacing:var(--type-sans-d-xs-reg-normal-ls)}
.slot.rejected .slot-btn{display:block;margin:.5rem 0;padding:.75rem 1rem;border:1px dashed var(--color-signal-adjust);background:var(--color-surface-secondary);color:var(--color-signal-adjust)}
.slot.rejected .ghost-title{text-decoration:line-through;text-decoration-thickness:2px}
.slot.rejected .ghost-hint{color:var(--color-signal-adjust)}
.tl.final .entry{padding:.5rem 0}
/* The end-screen timeline is a half-width column: stamps sit in the flow above the title, as on mobile, so titles keep their width */
.tl.final .stamp{position:static;display:inline-block;margin-top:.75rem;transform:rotate(-4deg)}
.tl.final .entry .card-title{padding-right:0}

/* Rounds */
.rounds{max-width:44rem}
.drawers{list-style:none;margin:0;padding:0}
.drawer{display:grid;grid-template-columns:3rem 1fr;gap:1rem;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--color-border);padding:1.5rem 0;cursor:pointer;position:relative}
.drawer:hover .drawer-title{text-decoration:underline;text-decoration-color:var(--color-text-weak);text-decoration-thickness:1px;text-underline-offset:4px}
.drawer-no{font-family:var(--font-serif);font-size:var(--type-serif-d-l-fs);line-height:var(--type-serif-d-l-lh);letter-spacing:var(--type-serif-d-l-ls);color:var(--color-text-tertiary)}
.drawer-title{display:block;font-family:var(--font-serif);font-size:var(--type-serif-d-xl-fs);line-height:var(--type-serif-d-xl-lh);letter-spacing:var(--type-serif-d-xl-ls)}
.drawer .stamp{top:1.5rem;right:0}

/* End */
.end-head{max-width:44rem;margin-bottom:40px}
.score{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;margin:0 0 1.5rem}
.score-num{font-family:var(--font-serif);font-size:var(--type-serif-d-2xl-fs);line-height:var(--type-serif-d-2xl-lh);letter-spacing:var(--type-serif-d-2xl-ls)}
.conclusion{max-width:36em;margin:0;font-size:var(--type-sans-d-l-reg-loose-fs);line-height:var(--type-sans-d-l-reg-loose-lh);letter-spacing:var(--type-sans-d-l-reg-loose-ls)}
.end-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start}
.end-grid h2{font-family:var(--font-serif);font-weight:400;font-size:var(--type-serif-d-xl-fs);line-height:var(--type-serif-d-xl-lh);letter-spacing:var(--type-serif-d-xl-ls);margin:0 0 .75rem;border-bottom:1px solid var(--color-border);padding-bottom:.75rem}
.reward{position:sticky;top:calc(1.5rem + env(safe-area-inset-top,0px))}
.postcard{margin:0;perspective:1800px}
.pc-inner{position:relative;aspect-ratio:3/2;transition:transform .4s cubic-bezier(.03,.96,.52,.98);transform-style:preserve-3d;border-radius:var(--radius-l);box-shadow:0 88px 17.5px rgba(0,0,0,.01),0 50px 15px rgba(0,0,0,.03),0 22px 11px rgba(0,0,0,.05),0 6px 6px rgba(0,0,0,.06)}
.pc-inner.flipped{transform:rotateY(180deg)}
.pc-inner canvas{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius-l)}
.pc-inner .pc-back{transform:rotateY(180deg)}
.pc-actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.5rem}
.status-msg{min-height:18px;margin:.5rem 0 0;color:var(--color-text-secondary);font-size:var(--type-sans-d-s-reg-tight-fs);line-height:var(--type-sans-d-s-reg-tight-lh);letter-spacing:var(--type-sans-d-s-reg-tight-ls)}
.status-msg:empty{margin:0}
.unlocked{margin-top:2rem;border-top:1px solid var(--color-border);padding-top:1.5rem}
.unlocked .fine{margin:0}
.unlocked h3{font-family:var(--font-serif);font-weight:400;font-size:var(--type-serif-d-l-fs);line-height:var(--type-serif-d-l-lh);letter-spacing:var(--type-serif-d-l-ls);margin:.25rem 0 .5rem}
.unlocked p{margin:.5rem 0 1rem}

/* ---- Tablet (<1200, token tier "t") ---- */
@media screen and (max-width:1199px){
  .rules h1,.rounds h1,.end-head h1,.score-num{font-size:var(--type-serif-t-2xl-fs);line-height:var(--type-serif-t-2xl-lh);letter-spacing:var(--type-serif-t-2xl-ls)}
  .card-title,.drawer-title,.end-grid h2{font-size:var(--type-serif-t-xl-fs);line-height:var(--type-serif-t-xl-lh);letter-spacing:var(--type-serif-t-xl-ls)}
}

/* ---- Layout: board collapses to one column below lg (992) ---- */
@media screen and (max-width:991px){
  .board,.end-grid{grid-template-columns:1fr}
  .deck,.reward{position:static}
  .game.has-selection .deck-actions{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0;padding:.75rem var(--container-pad) calc(.75rem + env(safe-area-inset-bottom,0px));background:var(--color-surface-primary);border-top:1px solid var(--color-border);align-items:center}
  .game.has-selection .deck-actions .selected-info{display:block;flex:1 1 100%;margin:0;font-family:var(--font-serif);font-size:var(--type-serif-m-2xl-fs);line-height:var(--type-serif-m-2xl-lh);letter-spacing:var(--type-serif-m-2xl-ls)}
  .game.has-selection .deck-actions .btn{flex:1}
  .game.has-selection{padding-bottom:9rem}
}

/* ---- Mobile (<768, token tier "m") ---- */
@media screen and (max-width:768px){
  .card{padding:0 1rem 1rem}
  .entry,.slot{grid-template-columns:4.5rem 1rem minmax(0,1fr);column-gap:.5rem}
  .stamp{position:static;display:inline-block;margin-top:.75rem;transform:rotate(-4deg)}
  @keyframes press{from{transform:rotate(-4deg) scale(1.2);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
  .entry.status-correct .card-title,.entry.status-corrected .card-title{padding-right:0}
  .drawer .stamp{margin-top:.5rem}

  .round-name{font-size:var(--type-sans-m-xl-bold-normal-fs);line-height:var(--type-sans-m-xl-bold-normal-lh);letter-spacing:var(--type-sans-m-xl-bold-normal-ls)}
  .card-title,.entry .card-title,.drawer-title,.end-grid h2,.unlocked h3,.ghost-title{font-size:var(--type-serif-m-2xl-fs);line-height:var(--type-serif-m-2xl-lh);letter-spacing:var(--type-serif-m-2xl-ls)}
  .entry-date .year,.drawer-no{font-size:var(--type-serif-m-2xl-fs);line-height:var(--type-serif-m-2xl-lh);letter-spacing:var(--type-serif-m-2xl-ls)}
  .entry .spine::after{top:calc(1.5rem + 6px)}
  .hero-kicker{font-size:var(--type-serif-m-l-fs);line-height:var(--type-serif-m-l-lh);letter-spacing:var(--type-serif-m-l-ls)}
  body,.intro,.card-desc,.entry .card-desc,.conclusion,.deck-hint{font-size:var(--type-sans-m-m-reg-loose-fs);line-height:var(--type-sans-m-m-reg-loose-lh);letter-spacing:var(--type-sans-m-m-reg-loose-ls)}
  .progress,.meta,.card-date,.slot-btn,.fine,.kbd-note,.deck-count,.entry-date .date-text,.src,.status-msg,.ghost-hint{font-size:var(--type-sans-m-s-reg-normal-fs);line-height:var(--type-sans-m-s-reg-normal-lh);letter-spacing:var(--type-sans-m-s-reg-normal-ls)}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .redact::after{display:none}
  .just-placed .date-text::after{display:none}
}

    kinds: { publisher: "издательство", book: "книга", bookshop: "книжный магазин", fair: "книжная ярмарка", prize: "литературная премия", censorship: "цензура" }
  }
};
// Russian quotes around a card title, unless the title already carries its own «…» (CSV titles often do)
function q(t) { return t.includes("«") ? t : `«${t}»`; }
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

<!-- ===================== GAME LOGIC ===================== -->
<script>
(function () {
  "use strict";
  const DATA = TAMIZDAT_DATA;
  const EV = DATA.events;
  const app = document.getElementById("app");
  const live = document.getElementById("live");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

  const ICONS = {
    publisher: '<path d="M4 20V9l8-5 8 5v11M3 20h18M9.5 20v-6h5v6"/>',
    book: '<path d="M6 4h9.5A2.5 2.5 0 0 1 18 6.5V20H8.5A2.5 2.5 0 0 1 6 17.5z"/><path d="M6 17.5A2.5 2.5 0 0 1 8.5 15H18"/>',
    bookshop: '<path d="M4 20h16M5 4v16M19 4v16M5 4h14M8.5 8v9M11.5 8v9M14.3 8.4l2.2 8.3"/>',
    fair: '<path d="M3 20h18M5 20v-8l7-6 7 6v8M9.5 20v-5h5v5M12 6V3"/>',
    prize: '<circle cx="12" cy="9" r="5"/><path d="M9.2 13.4 7.8 21l4.2-2.4 4.2 2.4-1.4-7.6"/>',
    censorship: '<path d="M4 5.5h16M4 19h10"/><rect x="4" y="8.6" width="12" height="2.8" fill="currentColor" stroke="none"/><rect x="7" y="13.4" width="13" height="2.8" fill="currentColor" stroke="none"/>'
  };

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  const state = {
    lang: store.get("tz-lang", null) || ((navigator.language || "").toLowerCase().startsWith("ru") ? "ru" : "en"),
    screen: "landing",
    confirmExit: false,
    demoPaused: false,
    heroPlayed: false,
    round: null,        // {id, events:[], anchor}
    placed: [],         // [{id, status:'anchor'|'correct'|'corrected', note}]
    deck: [],
    current: null,
    selectedSlot: null,
    rejectedSlot: null,
    justPlaced: null,
    firstTry: 0,
    busy: false,
    focusSlot: null,
    focusEntry: null,
    flipped: false,
    best: store.get("tz-best", {})
  };

  /* ---------- helpers ---------- */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const t = (key, ...a) => { const v = I18N[state.lang][key]; return typeof v === "function" ? v(...a) : v; };
  const L = o => (o ? (o[state.lang] ?? o.en ?? o.ru ?? "") : "");
  // Titles of works are marked *like this* in the English texts: shown in italics, read without the marks
  const plain = s => String(s).replace(/\*/g, "");
  const rich = s => esc(s).replace(/\*([^*]+)\*/g, "<em>$1</em>");
  const title = id => plain(L(EV[id].title));
  const titleHtml = id => rich(L(EV[id].title));
  const dateLabel = id => L(EV[id].date.label);
  const yearKey = id => EV[id].date.yearLabel || EV[id].date.start.slice(0, 4);
  function announce(msg) { live.textContent = ""; setTimeout(() => { live.textContent = msg; }, 40); }
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const wait = ms => new Promise(r => setTimeout(r, reduceMotion.matches ? 0 : ms));

  /* ---------- chronology: dates are ranges; "before" only when ranges don't overlap ---------- */
  const before = (a, b) => EV[a].date.end < EV[b].date.start;
  function isValidSlot(slot, id) {
    const P = state.placed;
    for (let i = 0; i < slot; i++) if (before(id, P[i].id)) return false;
    for (let i = slot; i < P.length; i++) if (before(P[i].id, id)) return false;
    return true;
  }
  function nearestValidSlot(id, from) {
    let best = null;
    for (let s = 0; s <= state.placed.length; s++) {
      if (isValidSlot(s, id) && (best === null || Math.abs(s - from) < Math.abs(best - from))) best = s;
    }
    return best;
  }
  const sortChrono = ids => ids.slice().sort((a, b) => EV[a].date.start.localeCompare(EV[b].date.start) || EV[a].date.end.localeCompare(EV[b].date.end));

  /* ---------- rounds ---------- */
  const multi = () => DATA.rounds.length > 1;
  function roundDef(id) { return DATA.rounds.find(r => r.id === id); }
  function startRound(id) {
    const def = roundDef(id);
    let events, anchor;
    if (def.draw && def.draw < def.events.length) {
      events = shuffle(def.events).slice(0, def.draw);
      const sorted = sortChrono(events);
      anchor = sorted[2 + Math.floor(Math.random() * Math.max(1, sorted.length - 4))];
    } else {
      events = def.events.slice();
      anchor = def.anchor || sortChrono(events)[Math.floor(events.length / 2)];
    }
    const postcards = Object.keys(DATA.archive.postcards);
    const postcard = def.postcard === "random" ? postcards[Math.floor(Math.random() * postcards.length)] : def.postcard;
    state.round = { id, events, anchor, postcard };
    state.placed = [{ id: anchor, status: "anchor" }];
    state.deck = shuffle(events.filter(e => e !== anchor));
    state.current = state.deck.shift();
    Object.assign(state, { selectedSlot: null, rejectedSlot: null, justPlaced: null, firstTry: 0, busy: false, flipped: false, focusSlot: null, focusEntry: null });
    go("game");
    announce(t("annNext", title(state.current)));
  }
  function go(screen) {
    state.screen = screen;
    render();
    window.scrollTo({ top: 0, behavior: "auto" });
    const h = app.querySelector("h1");
    if (h && screen !== "landing") { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
  }

  /* ---------- rendering ---------- */
  function render() {
    document.documentElement.lang = state.lang;
    document.title = t("docTitle");
    document.getElementById("topbar").innerHTML = langHtml();
    const views = { landing: viewLanding, rules: viewRules, game: viewGame, end: viewEnd, rounds: viewRounds };
    if (drag.active) endDrag(null);
    removeClones();
    stopDemo();
    app.innerHTML = views[state.screen]();
    afterRender();
  }

  function langHtml() {
    return `<div class="lang" role="group" aria-label="${esc(t("langGroup"))}">${["en", "ru"].map(l =>
      `<button type="button" data-lang="${l}" lang="${l}" aria-pressed="${l === state.lang}">${l.toUpperCase()}</button>`).join("")}</div>`;
  }
  const homeName = () => L(DATA.rounds[0].title);
  function homeLink(text) {
    return `<button type="button" class="home-link" data-act="home" aria-label="${esc(homeName() + " — " + t("backStart"))}">${esc(text)}</button>`;
  }
  const homeCrumb = () => `<p class="home-crumb">${homeLink("← " + homeName())}</p>`;

  function viewLanding() {
    const w = t("heroWords");
    const minis = [-2.5, 1.5, -1, 2.2, -1.8, .8, -.6].map(r => `<span class="mini" style="--r:${r}deg"></span>`).join("");
    return `<section class="landing ${state.heroPlayed ? "no-anim" : ""}">
      <h1 class="hero-title">${w.map((x, i) => `<span class="redact" style="--i:${i}">${esc(x)}</span>`).join(" ")}</h1>
      <p class="hero-kicker">${esc(t("heroSub"))}</p>
      <p class="intro">${esc(t("intro")).replace(/\n/g, "<br>")}</p>
      <div class="actions">
        ${multi() ? `<button class="btn primary" data-act="rounds">${esc(t("chooseTimeline"))}</button>` : `<button class="btn primary" data-act="start" data-round="${esc(DATA.rounds[0].id)}">${esc(t("startNow"))}</button>`}
        <button class="btn" data-act="rules">${esc(t("howToPlay"))}</button>
      </div>
      <div class="hero-cards" aria-hidden="true">${minis}</div>
    </section>`;
  }

  function viewRules() {
    return `<section class="rules">
      ${homeCrumb()}
      <h1>${esc(t("rulesTitle"))}</h1>
      <div class="rules-body">
      <div class="rules-text">
      <ol class="rule-list">${t("rules").map(r => `<li>${esc(r)}</li>`).join("")}</ol>
      <p class="kbd-note">${esc(t("kbdNote"))}</p>
      <div class="actions">
        <button class="btn primary" data-act="start" data-round="${esc(DATA.rounds[0].id)}">${esc(t("startFirst"))}</button>
        ${multi() ? `<button class="btn" data-act="rounds">${esc(t("chooseTimeline"))}</button>` : ""}
      </div>
      </div>
      ${demoHtml()}
      </div>
    </section>`;
  }

  /* ---------- how-to demo (rules page) ---------- */
  // Three real events in true order: the anchor, one placed right (drag), one placed wrong (tap)
  const DEMO_IDS = ["freedom-letters", "meduza-press", "idiot-books"].filter(id => EV[id]);
  const HAND_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 13.5V4.8a1.5 1.5 0 0 1 3 0v6.7m0-1.7a1.5 1.5 0 0 1 3 0v1.7m0-1a1.5 1.5 0 0 1 3 0v1.5m0-.6a1.5 1.5 0 0 1 3 0v4.1c0 3.5-2.7 6.5-6.2 6.5h-1.6c-2 0-3.8-1-4.9-2.7l-2.6-4.1a1.6 1.6 0 0 1 2.5-2l1.8 1.9"/></svg>';
  function demoCardHtml(id, cls, stamp) {
    const e = EV[id];
    return `<div class="d-card ${cls}" data-d="${cls}"><span class="d-meta">${esc(L(e.kindLabel))}</span><span class="d-title">${rich(L(e.title))}</span><span class="d-line"></span>${stamp ? `<span class="d-stamp ${stamp === "denied" ? "denied" : ""}">${esc(t(stamp === "denied" ? "stampDenied" : "stampCorrect"))}</span>` : ""}</div>`;
  }
  function demoHtml() {
    if (DEMO_IDS.length < 3) return "";
    const [anchor, a, b] = DEMO_IDS;
    const yr = id => EV[id].date.start.slice(0, 4);
    const steps = t("demoSteps");
    return `<aside class="rules-demo" aria-label="${esc(t("demoLabel"))}">
      <div class="demo">
        <div class="demo-stage" aria-hidden="true">
          <span class="d-spine"></span>
          <span class="d-gap" data-d="g0">${esc(t("placeHere"))}</span>
          <span class="d-year" data-d="y0" style="left:40.5%;top:15.5%">${yr(anchor)}</span><span class="d-dot" data-d="o0" style="left:50%;top:17%"></span>
          ${demoCardHtml(anchor, "anchor")}
          <span class="d-gap" data-d="g1">${esc(t("placeHere"))}</span>
          <span class="d-gap" data-d="g2">${esc(t("placeHere"))}</span>
          <span class="d-gap" data-d="g3">${esc(t("placeHere"))}</span>
          <span class="d-year" data-d="ya" style="left:40.5%;top:42.5%">${yr(a)}</span><span class="d-dot" data-d="oa" style="left:50%;top:44%"></span>
          <span class="d-year" data-d="yb" style="left:40.5%;top:69.5%">${yr(b)}</span><span class="d-dot denied" data-d="ob" style="left:50%;top:71%"></span>
          ${demoCardHtml(a, "a", "ok")}
          ${demoCardHtml(b, "b", "denied")}
          <span class="d-btn" data-d="btn">${esc(t("confirm"))}</span>
          <span class="d-hand" data-d="hand">${HAND_SVG}</span>
        </div>
        <div class="demo-foot">
          <p class="demo-caption" id="demo-caption">${reduceMotion.matches ? `<ol>${steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : esc(steps[0])}</p>
          <button type="button" class="demo-toggle" data-act="demo-toggle" aria-pressed="${state.demoPaused}">${esc(t(state.demoPaused ? "demoPlay" : "demoPause"))}</button>
        </div>
      </div>
    </aside>`;
  }

  // Positions in % of the stage. Rows: gap above the anchor, anchor, then two slots below it.
  const DP = {
    deck: [1, 8], anchor: [54, 8], slotA: [54, 35], slotB: [54, 62],
    g0: 1, g1: 28, g2: 55, g3: 82,
    btnTip: [12, 34.5]
  };
  // Each step: the board's state after it, its caption (index into demoSteps) and how long to hold it.
  const DEMO_STEPS = [
    { ms: 900,  cap: 0, a: "deck", b: null, btn: true, hand: null, gaps: ["g0", "g1"] },
    { ms: 700,  cap: 0, a: "deck", b: null, btn: true, hand: [20, 17], gaps: ["g0", "g1"] },
    { ms: 450,  cap: 0, a: "deck", lift: true, b: null, btn: true, hand: [20, 17], press: true, gaps: ["g0", "g1"] },
    { ms: 1100, cap: 0, a: "slotA", lift: true, b: null, btn: true, hand: [73, 44], press: true, gaps: ["g0", "g1"], on: "g1" },
    { ms: 500,  cap: 0, a: "slotA", b: null, btn: true, hand: [73, 44], gaps: ["g0"], ready: true },
    { ms: 1000, cap: 0, a: "slotA", b: null, btn: true, hand: DP.btnTip, gaps: ["g0"], ready: true },
    { ms: 600,  cap: 0, a: "slotA", b: null, btn: true, hand: DP.btnTip, press: true, btnPress: true, gaps: ["g0"], ready: true },
    { ms: 2300, cap: 1, a: "slotA", placedA: true, b: null, hand: null, gaps: ["g0", "g1", "g2"] },
    { ms: 1000, cap: 2, a: "slotA", placedA: true, b: "deck", hand: [64, 3.7], gaps: ["g0", "g1", "g2"] },
    { ms: 700,  cap: 2, a: "slotA", placedA: true, b: "deck", hand: [64, 3.7], press: true, gaps: ["g0", "g1", "g2"], on: "g0", ready: true },
    { ms: 1000, cap: 2, a: "slotA", placedA: true, b: "deck", hand: DP.btnTip, gaps: ["g0", "g1", "g2"], on: "g0", ready: true },
    { ms: 700,  cap: 2, a: "slotA", placedA: true, b: "deck", hand: DP.btnTip, press: true, btnPress: true, gaps: ["g0", "g1", "g2"], miss: "g0", ready: true },
    { ms: 2800, cap: 3, a: "slotA", placedA: true, b: "slotB", placedB: true, hand: null, gaps: ["g0", "g1", "g2", "g3"] },
    { ms: 450,  cap: 3, fade: true, a: "slotA", placedA: true, b: "slotB", placedB: true, hand: null, gaps: ["g0", "g1", "g2", "g3"] }
  ];
  let demoTimer = null, demoStep = 0;
  function stopDemo() { clearTimeout(demoTimer); demoTimer = null; }
  function demoApply(st) {
    const root = app.querySelector(".demo-stage");
    if (!root) return false;
    const q = k => root.querySelector(`[data-d="${k}"]`);
    const put = (el, xy) => { el.style.left = xy[0] + "%"; el.style.top = xy[1] + "%"; };
    root.classList.toggle("fade", !!st.fade);
    put(q("anchor"), DP.anchor);
    const a = q("a"), b = q("b");
    put(a, DP[st.a]); a.classList.toggle("lifted", !!st.lift); a.classList.toggle("stamped", !!st.placedA);
    b.style.opacity = st.b ? 1 : 0; put(b, DP[st.b || "deck"]); b.classList.toggle("stamped", !!st.placedB);
    a.style.zIndex = st.lift ? 2 : 1;
    ["ya", "oa"].forEach(k => q(k).style.opacity = st.placedA ? 1 : 0);
    ["yb", "ob"].forEach(k => q(k).style.opacity = st.placedB ? 1 : 0);
    [["g0", DP.g0], ["g1", DP.g1], ["g2", DP.g2], ["g3", DP.g3]].forEach(([k, y]) => {
      const g = q(k);
      g.style.top = y + "%";
      g.style.opacity = st.gaps.includes(k) ? 1 : 0;
      g.classList.toggle("on", st.on === k);
      g.classList.toggle("miss", st.miss === k);
      g.firstChild.textContent = st.miss === k ? t("rejected") : t("placeHere");
    });
    const btn = q("btn");
    btn.style.opacity = st.btn || st.b === "deck" ? "" : 0; // only while a card waits to be placed
    btn.classList.toggle("ready", !!st.ready);
    btn.classList.toggle("press", !!st.btnPress);
    const hand = q("hand");
    if (st.hand) put(hand, st.hand);
    hand.classList.toggle("show", !!st.hand);
    hand.classList.toggle("press", !!st.press);
    const cap = document.getElementById("demo-caption");
    if (cap) cap.textContent = t("demoSteps")[st.cap];
    return true;
  }
  // Jump to a step with no transitions (first frame, and the reset between loops while the board is faded out)
  function demoApplyInstant(st) {
    const stage = app.querySelector(".demo-stage");
    if (!stage) return false;
    const els = [stage, ...stage.querySelectorAll("*")];
    els.forEach(el => el.style.transition = "none");
    demoApply({ ...st, fade: true });
    stage.offsetWidth; // commit the layout before transitions come back
    els.forEach(el => el.style.transition = "");
    stage.classList.toggle("fade", !!st.fade); // the board itself still fades back in
    return true;
  }
  function runDemo() {
    stopDemo();
    if (state.demoPaused) return;
    const st = DEMO_STEPS[demoStep];
    if (!(demoStep === 0 ? demoApplyInstant(st) : demoApply(st))) return;
    demoTimer = setTimeout(() => { demoStep = (demoStep + 1) % DEMO_STEPS.length; runDemo(); }, st.ms);
  }
  function startDemo() {
    if (!app.querySelector(".demo-stage")) return;
    if (reduceMotion.matches) { demoApply(DEMO_STEPS[DEMO_STEPS.length - 2]); document.getElementById("demo-caption").innerHTML = `<ol>${t("demoSteps").map(x => `<li>${esc(x)}</li>`).join("")}</ol>`; return; }
    if (state.demoPaused) { demoApplyInstant(DEMO_STEPS[demoStep]); return; }
    demoStep = 0;
    runDemo();
  }

  function viewRounds() {
    const roman = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII"];
    return `<section class="rounds">
      <h1>${esc(t("roundsTitle"))}</h1>
      <ul class="drawers">${DATA.rounds.map((r, i) => {
        const b = state.best[r.id];
        return `<li><button class="drawer" data-act="start" data-round="${esc(r.id)}">
          <span class="drawer-no" aria-hidden="true">${roman[i] || i + 1}</span>
          <span class="drawer-title">${esc(L(r.title))}</span>
          ${b ? `<span class="stamp">${esc(t("best", b.s, b.t))}</span>` : ""}
        </button></li>`;
      }).join("")}</ul>
      <div class="actions"><button class="btn quiet" data-act="landing">${esc(t("backStart"))}</button></div>
    </section>`;
  }

  function kindLabel(id) { const e = EV[id]; return e.kindLabel ? L(e.kindLabel) : I18N[state.lang].kinds[e.kind]; }

  function cardHead(id, extra) {
    return `<div class="card-head"><span class="meta"><span class="item">${esc(kindLabel(id))}</span>${extra || ""}</span><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[EV[id].kind] || ""}</svg></div>`;
  }
  function imageHtml(id) {
    const img = EV[id].image;
    return img ? `<img src="${esc(img.src)}" alt="${esc(L(img.alt))}" loading="lazy" style="display:block;margin-top:.75rem;border-radius:var(--radius-s)">` : "";
  }

  function currentCardHtml(id) {
    return `<article class="card current" id="current-card" aria-labelledby="current-title">
      ${cardHead(id)}
      <h2 class="card-title" id="current-title">${titleHtml(id)}</h2>
      <p class="card-desc">${rich(L(EV[id].text))}</p>
      ${imageHtml(id)}
      <p class="card-date"><span>${esc(t("date"))}</span><span class="bar" role="img" aria-label="${esc(t("dateHidden"))}"></span></p>
    </article>`;
  }

  function placedCardHtml(p) {
    const id = p.id, e = EV[id];
    const anchorBit = p.status === "anchor" ? `<span class="item anchor-label">${esc(t("stampAnchor").toLowerCase())}</span>` : "";
    let feedback = "";
    if (p.status === "correct") feedback = `<span class="stamp">${esc(t("stampCorrect"))}</span>`;
    if (p.status === "corrected") feedback = `<span class="stamp denied">${esc(t("stampDenied"))}</span>`;
    return `<article class="card placed" tabindex="-1" id="entry-${esc(id)}" aria-labelledby="t-${esc(id)}">
      ${cardHead(id, anchorBit)}
      ${feedback}
      <h3 class="card-title" id="t-${esc(id)}">${titleHtml(id)}</h3>
      <p class="card-desc">${rich(L(e.text))}</p>
      ${imageHtml(id)}
      <p class="src">${esc(t(e.sources.length > 1 ? "sources" : "source"))} ${e.sources.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(typeof s.label === "string" ? s.label : L(s.label))}</a>`).join(", ")}</p>
    </article>`;
  }

  function timelineHtml(interactive) {
    const P = state.placed, n = P.length, out = [];
    for (let i = 0; i <= n; i++) {
      if (interactive) out.push(slotHtml(i));
      if (i < n) {
        // Each card carries its own date, so placing a neighbour never changes it.
        const p = P[i], yk = yearKey(p.id), label = dateLabel(p.id);
        const dateText = label === yk ? "" : label;
        out.push(`<li class="entry status-${p.status} ${p.id === state.justPlaced ? "just-placed" : ""}">
          <div class="entry-date"><span class="year">${esc(yk)}</span>${dateText ? `<time class="date-text" datetime="${esc(EV[p.id].date.start)}">${esc(dateText)}</time>` : ""}</div>
          <span class="spine" aria-hidden="true"></span>
          ${placedCardHtml(p)}
        </li>`);
      }
    }
    return out.join("");
  }

  function slotHtml(i) {
    const P = state.placed, n = P.length;
    const sel = state.selectedSlot === i, rej = state.rejectedSlot === i;
    let label;
    if (i === 0) label = t("slotFirst", title(P[0].id));
    else if (i === n) label = t("slotLast", title(P[n - 1].id));
    else label = t("slotBetween", title(P[i - 1].id), title(P[i].id));
    const cls = ["slot", i === 0 ? "is-first" : "", i === n ? "is-last" : "", sel ? "selected" : "", rej ? "rejected" : ""].join(" ");
    let inner;
    if (rej) inner = `<span class="ghost-title">${titleHtml(state.current)}</span><span class="ghost-hint">${esc(t("rejected"))}</span>`;
    else if (sel) inner = `<span class="ghost-title">${titleHtml(state.current)}</span><span class="ghost-hint">${esc(t("ghostHint"))}</span>`;
    else inner = `<span class="slot-rule"></span><span class="slot-label">${esc(t("placeHere"))}</span>`;
    return `<li class="${cls}"><span aria-hidden="true"></span><span class="spine" aria-hidden="true"></span>
      <button type="button" class="slot-btn" data-slot="${i}" aria-label="${esc(label)}" aria-pressed="${sel}" ${state.current && !state.busy ? "" : "disabled"}>${inner}</button></li>`;
  }

  function viewGame() {
    const total = state.round.events.length;
    const remaining = state.deck.length;
    let deck;
    if (state.current) {
      const edges = Math.min(2, remaining);
      deck = `<div class="deck-stack">${edges >= 2 ? '<div class="stack-edge e2"></div>' : ""}${edges >= 1 ? '<div class="stack-edge e1"></div>' : ""}${currentCardHtml(state.current)}</div>
        <p class="deck-count">${esc(t("cardsLeft", remaining))}</p>
        ${state.selectedSlot == null ? `<p class="deck-hint">${esc(t("hintPick"))}</p>` : ""}
        <div class="deck-actions">
          <p class="selected-info">${titleHtml(state.current)}</p>
          ${state.selectedSlot != null ? `<button class="btn" data-act="cancel-slot" ${state.busy ? "disabled" : ""}>${esc(t("cancel"))}</button>` : ""}
          <button class="btn primary" data-act="confirm" ${state.selectedSlot == null || state.busy ? "disabled" : ""}>${esc(t("confirm"))}</button>
        </div>`;
    } else {
      deck = `<div class="deck-done"><p>${esc(t("doneText"))}</p><button class="btn primary" data-act="end">${esc(t("seeResults"))}</button></div>`;
    }
    return `<section class="game ${state.selectedSlot != null && state.current ? "has-selection" : ""}">
      <div class="game-head"><h1 class="round-name">${homeLink(L(roundDef(state.round.id).title))}</h1><p class="progress">${esc(t("progress", state.placed.length, total))}</p></div>
      ${state.confirmExit ? `<div class="exit-confirm" role="alertdialog" aria-labelledby="exit-q">
        <p id="exit-q">${esc(t("exitQuestion"))}</p>
        <div class="btns"><button class="btn primary" data-act="exit-stay">${esc(t("exitNo"))}</button><button class="btn" data-act="exit-leave">${esc(t("exitYes"))}</button></div>
      </div>` : ""}
      <div class="board">
        <aside class="deck" aria-label="${esc(t("deckLabel"))}">${deck}</aside>
        <section class="timeline" aria-label="${esc(t("timelineLabel"))}"><ol class="tl">${timelineHtml(!!state.current)}</ol></section>
      </div>
    </section>`;
  }

  function scoreTotals() { return { s: state.firstTry, tot: state.placed.length - 1 }; }

  function viewEnd() {
    const { s, tot } = scoreTotals();
    const pc = DATA.archive.postcards[state.round.postcard];
    const obj = DATA.archive.objects[pc.object];
    return `<section class="end">
      <header class="end-head">
        ${homeCrumb()}
        <h1>${esc(t("endTitle"))}</h1>
        <p class="score"><span class="score-num">${s} / ${tot}</span><span>${esc(t("scoreSub", s, tot))}</span></p>
        <p class="conclusion">${esc(L(roundDef(state.round.id).conclusion) || t("conclusion"))}</p>
        <div class="actions">
          <button class="btn primary" data-act="start" data-round="${esc(state.round.id)}">${esc(t(roundDef(state.round.id).draw ? "playAgain" : "replay"))}</button>
          ${multi() ? `<button class="btn" data-act="rounds">${esc(t("playAnother"))}</button>` : ""}
        </div>
      </header>
      <div class="end-grid">
        <section class="reward" aria-labelledby="pc-h">
          <h2 id="pc-h">${esc(t("postcardHeading"))}</h2>
          <figure class="postcard">
            <div class="pc-inner ${state.flipped ? "flipped" : ""}" id="pc-inner">
              <canvas class="pc-front" width="1500" height="1000" aria-hidden="${state.flipped}"></canvas>
              <canvas class="pc-back" width="1500" height="1000" aria-hidden="${!state.flipped}"></canvas>
            </div>
            <figcaption class="sr-only">${esc(t("pcAlt", L(obj.title), L(pc.fact)))}</figcaption>
          </figure>
          <div class="pc-actions">
            <button class="btn" data-act="flip">${esc(t("turnOver"))}</button>
            <button class="btn" data-act="download" id="dl-btn">${esc(t("download"))}</button>
            <a class="btn primary" href="${esc(DATA.config.archiveUrl)}" target="_blank" rel="noopener">${esc(t("explore"))}</a>
          </div>
          <p class="status-msg" id="pc-status" role="status"></p>
          <p class="fine"><a href="${esc(DATA.config.newsletterUrl)}" target="_blank" rel="noopener">${esc(t("newsletter"))}</a>. ${esc(t("newsletterNote"))}</p>
          <aside class="unlocked">
            <p class="fine">${esc(t("unlocked"))}</p>
            <h3>${esc(L(obj.author))}. ${state.lang === "ru" ? esc("«" + L(obj.title) + "»") : `<em>${esc(L(obj.title))}</em>`}</h3>
            ${L(obj.description).split("\n").map(x => `<p>${esc(x)}</p>`).join("")}
            <a href="${esc(obj.link)}" target="_blank" rel="noopener">${esc(t("openObject"))}</a>
          </aside>
        </section>
        <section aria-labelledby="tl-h">
          <h2 id="tl-h">${esc(t("timelineHeading"))}</h2>
          <ol class="tl final">${timelineHtml(false)}</ol>
        </section>
      </div>
    </section>`;
  }

  function afterRender() {
    if (state.screen === "landing") state.heroPlayed = true;
    if (state.screen === "rules") startDemo();
    state.justPlaced = null; // animate a newly placed card once, not on every later re-render
    if (state.screen === "game") {
      bindDrag();
      if (state.focusSlot != null) {
        const b = app.querySelector(`.slot-btn[data-slot="${state.focusSlot}"]`);
        if (b) {
          b.focus({ preventScroll: true });
          const bar = app.querySelector(".game.has-selection .deck-actions");
          const limit = bar && getComputedStyle(bar).position === "fixed" ? bar.getBoundingClientRect().top - 16 : window.innerHeight;
          const r = b.getBoundingClientRect();
          const dy = r.bottom > limit ? r.bottom - limit : (r.top < 0 ? r.top - 16 : 0);
          if (dy) window.scrollBy({ top: dy, behavior: reduceMotion.matches ? "auto" : "smooth" });
        }
        state.focusSlot = null;
      }
      if (state.focusEntry) {
        const el = document.getElementById("entry-" + state.focusEntry);
        if (el) {
          el.focus({ preventScroll: true });
          const r = el.getBoundingClientRect();
          if (r.top < 0 || r.bottom > window.innerHeight) el.scrollIntoView({ block: "center", behavior: reduceMotion.matches ? "auto" : "smooth" });
        }
        state.focusEntry = null;
      }
    }
    if (state.screen === "end") {
      drawPostcards();
      downloadsNs().then(ns => { if (ns === null) { const b = document.getElementById("dl-btn"); if (b) b.hidden = true; } });
    }
  }

  /* ---------- placement ---------- */
  function selectSlot(i) {
    if (!state.current || state.busy) return;
    if (state.selectedSlot === i) { confirmPlacement(); return; }
    state.selectedSlot = i;
    state.focusSlot = i;
    render();
    announce(t("annSelected", title(state.current)));
  }

  async function confirmPlacement() {
    if (state.busy || state.selectedSlot == null || !state.current) return;
    const id = state.current, slot = state.selectedSlot;
    if (isValidSlot(slot, id)) {
      commit(id, slot, "correct", null);
      state.firstTry++;
      announce(t("annCorrect", title(id), dateLabel(id)) + (state.current ? " " + t("annNext", title(state.current)) : ""));
      render();
      return;
    }
    state.busy = true;
    state.rejectedSlot = slot;
    state.selectedSlot = null;
    render();
    await wait(800);
    const target = nearestValidSlot(id, slot);
    state.rejectedSlot = null;
    commit(id, target, "corrected", null);
    announce(t("annMoved", title(id), dateLabel(id)) + (state.current ? " " + t("annNext", title(state.current)) : ""));
    render();
  }

  function commit(id, slot, status, note) {
    state.placed.splice(slot, 0, { id, status, note });
    state.justPlaced = id;
    state.focusEntry = id;
    state.selectedSlot = null;
    state.current = state.deck.shift() || null;
    state.busy = false;
    if (!state.current) {
      const { s, tot } = scoreTotals();
      const prev = state.best[state.round.id];
      if (!prev || s / tot >= prev.s / prev.t) { state.best[state.round.id] = { s, t: tot }; store.set("tz-best", state.best); }
    }
  }

  /* ---------- drag and drop (pointer events: mouse, pen, touch) ---------- */
  // Drag state lives outside render(), and move/up listeners sit on the window, so a drag always
  // ends cleanly even if the pointer leaves the card, the frame, or the card is re-rendered.
  const drag = { active: null };
  function removeClones() { document.querySelectorAll(".drag-clone").forEach(n => n.remove()); }
  function endDrag(dropSlot) {
    const d = drag.active;
    drag.active = null;
    window.removeEventListener("pointermove", onDragMove, true);
    window.removeEventListener("pointerup", onDragUp, true);
    window.removeEventListener("pointercancel", onDragCancel, true);
    window.removeEventListener("blur", onDragCancel);
    document.removeEventListener("keydown", onDragKey, true);
    document.removeEventListener("visibilitychange", onDragHidden);
    document.documentElement.style.userSelect = "";
    document.documentElement.style.webkitUserSelect = "";
    if (d) {
      cancelAnimationFrame(d.raf);
      if (d.target) d.target.classList.remove("drop-target");
      if (d.card && d.card.isConnected) d.card.classList.remove("lifted");
    }
    removeClones();
    if (dropSlot != null) selectSlot(dropSlot);
  }
  function pickSlot(x, y) {
    const tlEl = app.querySelector(".timeline");
    if (!tlEl) return null;
    const tl = tlEl.getBoundingClientRect();
    if (x < tl.left - 60 || x > tl.right + 60) return null;
    let best = null, bd = Infinity;
    app.querySelectorAll(".slot-btn").forEach(b => { const r = b.getBoundingClientRect(); const d = Math.abs(y - (r.top + r.height / 2)); if (d < bd) { bd = d; best = b; } });
    return best && bd < 220 ? best : null;
  }
  function autoscroll() {
    const d = drag.active;
    if (!d || !d.clone) return;
    const edge = 90, h = window.innerHeight;
    if (d.lastY < edge) window.scrollBy(0, -Math.ceil((edge - d.lastY) / 6));
    else if (d.lastY > h - edge) window.scrollBy(0, Math.ceil((d.lastY - (h - edge)) / 6));
    d.raf = requestAnimationFrame(autoscroll);
  }
  function onDragMove(e) {
    const d = drag.active;
    if (!d || e.pointerId !== d.id) return;
    if (!d.card.isConnected) { endDrag(null); return; }
    // Button released somewhere we didn't hear about (e.g. outside the frame): drop the drag.
    if (e.pointerType === "mouse" && e.buttons === 0) { endDrag(null); return; }
    if (!d.clone) {
      if (Math.hypot(e.clientX - d.x, e.clientY - d.y) <= 6) return;
      const r = d.card.getBoundingClientRect();
      d.offX = d.x - r.left; d.offY = d.y - r.top;
      removeClones();
      const clone = d.card.cloneNode(true);
      clone.removeAttribute("id");
      clone.setAttribute("aria-hidden", "true");
      clone.querySelectorAll("[id]").forEach(n => n.removeAttribute("id"));
      clone.classList.add("drag-clone");
      clone.style.width = r.width + "px";
      document.body.appendChild(clone);
      d.clone = clone;
      d.card.classList.add("lifted");
      d.raf = requestAnimationFrame(autoscroll);
    }
    e.preventDefault();
    d.lastY = e.clientY;
    d.clone.style.left = (e.clientX - d.offX) + "px";
    d.clone.style.top = (e.clientY - d.offY) + "px";
    const tgt = pickSlot(e.clientX, e.clientY);
    if (tgt !== d.target) { if (d.target) d.target.classList.remove("drop-target"); d.target = tgt; if (tgt) tgt.classList.add("drop-target"); }
  }
  function onDragUp(e) {
    const d = drag.active;
    if (!d || e.pointerId !== d.id) return;
    endDrag(d.clone && d.target ? Number(d.target.dataset.slot) : null);
  }
  function onDragCancel() { if (drag.active) endDrag(null); }
  function onDragHidden() { if (document.hidden) onDragCancel(); }
  function onDragKey(e) { if (e.key === "Escape" && drag.active) { e.preventDefault(); endDrag(null); } }

  function bindDrag() {
    const card = document.getElementById("current-card");
    if (!card) return;
    card.addEventListener("pointerdown", e => {
      if (state.busy || e.button > 0 || drag.active) return;
      if (e.target.closest("a, button, summary, input")) return;
      if (e.pointerType === "mouse") e.preventDefault(); // stop text selection while dragging
      drag.active = { id: e.pointerId, x: e.clientX, y: e.clientY, card, clone: null, target: null, raf: 0, lastY: e.clientY, offX: 0, offY: 0 };
      try { card.setPointerCapture(e.pointerId); } catch (err) {}
      document.documentElement.style.userSelect = "none";
      document.documentElement.style.webkitUserSelect = "none";
      window.addEventListener("pointermove", onDragMove, true);
      window.addEventListener("pointerup", onDragUp, true);
      window.addEventListener("pointercancel", onDragCancel, true);
      window.addEventListener("blur", onDragCancel);
      document.addEventListener("keydown", onDragKey, true);
      document.addEventListener("visibilitychange", onDragHidden);
    });
    card.addEventListener("lostpointercapture", () => {
      // Capture can be lost when the pointer leaves the frame; if no button is still held, end the drag.
      setTimeout(() => { if (drag.active && drag.active.card === card && !drag.active.clone) endDrag(null); }, 0);
    });
  }

  /* ---------- events ---------- */
  // Leaving mid-round asks first, once the player has placed at least one card
  function goHome() {
    const inRound = state.screen === "game" && state.placed.length > 1;
    if (inRound && !state.confirmExit) {
      state.confirmExit = true;
      render();
      app.querySelector('[data-act="exit-stay"]').focus();
      return;
    }
    state.confirmExit = false;
    go("landing");
  }

  document.getElementById("topbar").addEventListener("click", e => {
    const lb = e.target.closest("button[data-lang]");
    if (!lb || lb.dataset.lang === state.lang) return;
    state.lang = lb.dataset.lang;
    store.set("tz-lang", state.lang);
    render();
    document.querySelector(`#topbar button[data-lang="${state.lang}"]`).focus();
  });

  app.addEventListener("click", e => {
    const slot = e.target.closest(".slot-btn");
    if (slot) { selectSlot(Number(slot.dataset.slot)); return; }
    const a = e.target.closest("[data-act]");
    if (!a) return;
    const act = a.dataset.act;
    if (act === "rules") go("rules");
    else if (act === "rounds") go("rounds");
    else if (act === "landing") go("landing");
    else if (act === "home") goHome();
    else if (act === "exit-leave") { state.confirmExit = false; go("landing"); }
    else if (act === "exit-stay") { state.confirmExit = false; render(); app.querySelector(".round-name .home-link").focus(); }
    else if (act === "demo-toggle") {
      state.demoPaused = !state.demoPaused;
      a.setAttribute("aria-pressed", String(state.demoPaused));
      a.textContent = t(state.demoPaused ? "demoPlay" : "demoPause");
      if (state.demoPaused) stopDemo(); else runDemo();
    }
    else if (act === "start") startRound(a.dataset.round);
    else if (act === "confirm") confirmPlacement();
    else if (act === "cancel-slot") { state.selectedSlot = null; render(); }
    else if (act === "end") go("end");
    else if (act === "flip") {
      state.flipped = !state.flipped;
      document.getElementById("pc-inner").classList.toggle("flipped", state.flipped);
    }
    else if (act === "download") downloadPostcard();
  });

  document.addEventListener("keydown", e => { if (e.key === "Tab") document.documentElement.classList.add("kbd-user"); });
  app.addEventListener("keydown", e => {
    const b = e.target.closest && e.target.closest(".slot-btn");
    if (!b || (e.key !== "ArrowDown" && e.key !== "ArrowUp")) return;
    e.preventDefault();
    const all = Array.from(app.querySelectorAll(".slot-btn"));
    const i = all.indexOf(b) + (e.key === "ArrowDown" ? 1 : -1);
    if (all[i]) { all[i].focus(); all[i].scrollIntoView({ block: "nearest" }); }
  });

  /* ---------- postcard ----------
     Canvas can't read CSS custom properties, so these mirror the Tier‑1 primitives
     in tamizdat-design-system.md directly: ink-950, paper, ink-900, ink-500, plus the game ink (#3e69b7). */
  const PCC = { slate: "#1f2a2e", paper: "#fcfaf7", ink: "#263338", accent: "#3e69b7", muted: "#8a9599" };
  const F = { display: '"Excelsior LT Std", "Excelsior", serif', text: '"Inter Variable", "Inter", sans-serif' };

  function postcardContext() {
    const pc = DATA.archive.postcards[state.round.postcard];
    const obj = DATA.archive.objects[pc.object];
    const { s, tot } = scoreTotals();
    const date = new Date().toLocaleDateString(state.lang === "ru" ? "ru-RU" : "en-GB", { day: "numeric", month: "long", year: "numeric" });
    return { pc, obj, s, tot, date };
  }

  function wrap(ctx, text, x, y, maxW, lh) {
    const words = text.split(/\s+/); let line = "";
    for (const w of words) {
      const test = line ? line + " " + w : w;
      if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, y); line = w; y += lh; }
      else line = test;
    }
    if (line) { ctx.fillText(line, x, y); y += lh; }
    return y;
  }
  function fitFont(ctx, text, maxW, size, tpl) {
    ctx.font = tpl(size);
    while (ctx.measureText(text).width > maxW && size > 12) { size -= 2; ctx.font = tpl(size); }
    return size;
  }

  function drawStamp(ctx, x, y, w, h, bg) {
    ctx.save();
    ctx.fillStyle = PCC.paper; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = bg;
    const r = 7, step = 20;
    for (let i = x + 10; i <= x + w - 5; i += step) { ctx.beginPath(); ctx.arc(i, y, r, 0, 7); ctx.arc(i, y + h, r, 0, 7); ctx.fill(); }
    for (let j = y + 10; j <= y + h - 5; j += step) { ctx.beginPath(); ctx.arc(x, j, r, 0, 7); ctx.arc(x + w, j, r, 0, 7); ctx.fill(); }
    const ix = x + 18, iy = y + 18, iw = w - 36, ih = h - 36;
    ctx.fillStyle = PCC.accent; ctx.fillRect(ix, iy, iw, ih);
    // a small cactus, after the hero of Pkhentz
    ctx.fillStyle = PCC.paper;
    const cx = ix + iw / 2, base = iy + ih - 58, s = iw / 170;
    const rr = (px, py, pw, ph) => { ctx.beginPath(); ctx.roundRect(px, py, pw, ph, pw / 2); ctx.fill(); };
    rr(cx - 16 * s, base - 112 * s, 32 * s, 112 * s);
    rr(cx - 50 * s, base - 78 * s, 20 * s, 48 * s); ctx.fillRect(cx - 42 * s, base - 42 * s, 30 * s, 14 * s);
    rr(cx + 30 * s, base - 96 * s, 20 * s, 54 * s); ctx.fillRect(cx + 12 * s, base - 56 * s, 30 * s, 14 * s);
    ctx.fillRect(cx - 34 * s, base, 68 * s, 8 * s);
    ctx.font = `600 ${Math.round(19 * s)}px ${F.text}`; ctx.textAlign = "center";
    ctx.fillText("TAMIZDAT", cx, iy + ih - 20);
    ctx.fillText("2024", cx, iy + 34 * s);
    ctx.restore();
  }

  function drawFront(ctx, c) {
    ctx.fillStyle = PCC.slate; ctx.fillRect(0, 0, 1500, 1000);
    ctx.strokeStyle = "rgba(242,240,234,.35)"; ctx.lineWidth = 2; ctx.strokeRect(40, 40, 1420, 920);
    ctx.fillStyle = PCC.paper; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.font = `58px ${F.display}`;
    ctx.fillText(L(c.obj.author), 112, 250);
    const titleText = state.lang === "ru" ? L(c.obj.title).toUpperCase() : L(c.obj.title).toUpperCase();
    const size = fitFont(ctx, titleText, 1000, 250, s => `400 ${s}px ${F.display}`);
    ctx.fillText(titleText, 100, 250 + size * .95);
    // typed lines with censor bars
    const y0 = 690;
    ctx.fillStyle = "rgba(252,250,247,.28)";
    [[112, 560], [112, 470], [112, 610], [112, 380]].forEach(([x, w], i) => ctx.fillRect(x, y0 + i * 34, w, 3));
    ctx.fillStyle = PCC.slate;
    ctx.fillRect(250, y0 - 14, 260, 26); ctx.fillRect(170, y0 + 54, 330, 26);
    ctx.fillStyle = "rgba(252,250,247,.85)";
    ctx.font = `30px ${F.text}`;
    ctx.fillText(L(c.obj.imprint), 112, 900);
    drawStamp(ctx, 1180, 96, 210, 260, PCC.slate);
  }

  function drawBack(ctx, c) {
    ctx.fillStyle = PCC.paper; ctx.fillRect(0, 0, 1500, 1000);
    ctx.strokeStyle = PCC.muted; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(790, 90); ctx.lineTo(790, 910); ctx.stroke();
    ctx.fillStyle = PCC.ink; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.font = `64px ${F.display}`;
    let y = wrap(ctx, t("pcGreeting"), 90, 175, 650, 72);
    ctx.font = `38px ${F.text}`;
    y = wrap(ctx, L(c.pc.fact), 90, y + 44, 650, 56);
    ctx.fillStyle = PCC.muted; ctx.font = `26px ${F.text}`;
    ctx.fillText("tamizdatproject.org", 90, 905);
    // stamp + postmark
    drawStamp(ctx, 1210, 80, 180, 225, PCC.paper);
    ctx.save();
    ctx.strokeStyle = "rgba(97,85,245,.8)"; ctx.fillStyle = "rgba(97,85,245,.85)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(1110, 300, 100, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(1110, 300, 84, 0, Math.PI * 2); ctx.stroke();
    ctx.textAlign = "center";
    ctx.font = `600 22px ${F.text}`; ctx.fillText(t("pcMark"), 1110, 268);
    fitFont(ctx, c.date, 150, 24, s => `${s}px ${F.text}`); ctx.fillText(c.date, 1110, 312);
    ctx.font = `20px ${F.text}`; ctx.fillText(`${c.s}/${c.tot}`, 1110, 348);
    for (let k = 0; k < 4; k++) {
      ctx.beginPath();
      for (let x = 840; x <= 1000; x += 4) { const yy = 250 + k * 26 + Math.sin((x - 840) / 18) * 7; x === 840 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy); }
      ctx.stroke();
    }
    ctx.restore();
    // address lines
    const lines = [t("pcTo"), L(roundDef(state.round.id).title), t("pcScore", c.s, c.tot), c.date];
    ctx.strokeStyle = PCC.muted; ctx.lineWidth = 1.5; ctx.fillStyle = PCC.ink; ctx.textAlign = "left";
    lines.forEach((txt, i) => {
      const ly = 560 + i * 92;
      ctx.beginPath(); ctx.moveTo(840, ly); ctx.lineTo(1410, ly); ctx.stroke();
      fitFont(ctx, txt, 560, 28, s => `${s}px ${F.text}`);
      ctx.fillText(txt, 846, ly - 14);
    });
  }

  async function fontsReady() {
    if (!document.fonts || !document.fonts.load) return;
    const sample = "Пхенц Привет Abc 0123";
    const loads = [`400 250px ${F.display}`, `56px ${F.display}`, `600 31px ${F.text}`, `28px ${F.text}`].map(f => document.fonts.load(f, sample).catch(() => null));
    await Promise.race([Promise.all(loads), new Promise(r => setTimeout(r, 2500))]);
  }

  async function drawPostcards() {
    await fontsReady();
    if (state.screen !== "end") return;
    const c = postcardContext();
    const front = app.querySelector(".pc-front"), back = app.querySelector(".pc-back");
    if (!front || !back) return;
    drawFront(front.getContext("2d"), c);
    drawBack(back.getContext("2d"), c);
  }

  let dlPromise = null;
  function downloadsNs() {
    // undefined = standalone page (use a plain download link); null = hosted view without the capability.
    if (!dlPromise) {
      dlPromise = (window.claude && typeof window.claude.use === "function")
        ? window.claude.use("downloads").catch(() => null)
        : Promise.resolve(undefined);
    }
    return dlPromise;
  }
  downloadsNs();

  async function downloadPostcard() {
    const status = document.getElementById("pc-status");
    await fontsReady();
    const c = postcardContext();
    const cv = document.createElement("canvas");
    cv.width = 1500; cv.height = 2040;
    const ctx = cv.getContext("2d");
    ctx.fillStyle = "#edebe8"; ctx.fillRect(0, 0, 1500, 2040);
    drawFront(ctx, c);
    ctx.save(); ctx.translate(0, 1040); drawBack(ctx, c); ctx.restore();
    const blob = await new Promise(r => cv.toBlob(r, "image/png"));
    const filename = state.lang === "ru" ? "otkrytka-iz-tamizdata.png" : "postcard-from-tamizdat.png";
    const ns = await downloadsNs();
    if (ns) {
      try { await ns.save({ filename, data: blob }); status.textContent = t("downloadSaved"); }
      catch (err) { status.textContent = err && err.code === "declined" ? t("downloadDeclined") : t("downloadFailed"); }
      return;
    }
    if (ns === null) { status.textContent = t("downloadFailed"); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }


  render();
})();
</script>
</body>
</html>
